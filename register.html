<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | StudentDeals</title>
</head>

<body>

  <form id="register-form">
    <h2>Register for StudentDeals</h2>

    <input
      type="email"
      id="email"
      placeholder="Email Address"
      required
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    />

    <button type="submit">Sign Up</button>

    <p id="status-message"></p>
  </form>

</body>
</html>
