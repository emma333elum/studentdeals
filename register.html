<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDeals | Register</title>
    <link rel="stylesheet" href="reg.css">
    <script src="reg.js" defer></script>
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">

            <a href="index.html" class="logo">
                Student<span>Deals.</span>
            </a>

            <p class="eyebrow">JOIN THE COMMUNITY</p>
            <h1>Create your account</h1>

            <p class="auth-description">
                Discover exclusive discounts and offers
                available to students around FUNAAB.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname"
                        placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Your email address" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password"
                            placeholder="At least 8 characters"
                            minlength="8" required>
                        <button type="button"
                            class="toggle-password"
                            data-target="password">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword"
                            placeholder="Confirm your password" required>
                        <button type="button"
                            class="toggle-password"
                            data-target="confirmPassword">Show</button>
                    </div>
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p id="message" class="form-message"
                    aria-live="polite"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to homepage
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
