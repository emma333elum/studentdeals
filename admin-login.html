
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentDeals | Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

  <main class="login-card">
    <a href="index.html" class="login-brand">Student<span>Deals.</span></a>

    <p class="eyebrow">ADMINISTRATION</p>
    <h1>Welcome back.</h1>
    <p class="login-intro">Sign in to manage campus discount submissions.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="admin@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit" id="loginBtn">Sign in to dashboard</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>

    <a href="index.html" class="back-link">← Back to marketplace</a>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
